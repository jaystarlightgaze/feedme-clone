<!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend product screens; keep the review shell):
  - Product:  .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Use one option per product destination or distinct surface,
               named by its product role. Keep baselines, variants, comparison
               labels, steps, indexes, and progress out of names and states.
               Links may use href="#slug".
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style. When the project ships dark
               tokens, copy them under .sh-theme-dark, which the shell sets
               on both the root element and body, so :root.sh-theme-dark and
               body.sh-theme-dark work too. A .dark class or a
               prefers-color-scheme media query copied verbatim would follow
               the reviewer's system instead of the toggle.
  - Theme:    the light / dark switch (t) changes the product surface only.
               It appears only when a .sh-theme-dark rule declares dark tokens,
               so a prototype without them carries no theme control. Prototypes
               always load light; the review bar keeps its own dark styling in
               both themes so it still reads as chrome.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  - Chrome:   Keep exactly the screen selector, selected-screen state selector,
               viewport cycle, and theme toggle.

  Self-contained by design: no build, no framework, no network.
-->
<meta charset="utf-8">
<title>Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ── project tokens: copied verbatim from app/globals.css ── */
  :root {
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.145 0 0);
    --popover: oklch(1 0 0);
    --popover-foreground: oklch(0.145 0 0);
    --primary: oklch(0.205 0 0);
    --primary-foreground: oklch(0.985 0 0);
    --secondary: oklch(0.97 0 0);
    --secondary-foreground: oklch(0.205 0 0);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0);
    --accent-foreground: oklch(0.205 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --border: oklch(0.922 0 0);
    --input: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0);
    --radius: 0.625rem;
    /* Geist (network font) replaced with a system stack */
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .sh-theme-dark {
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --card-foreground: oklch(0.985 0 0);
    --popover: oklch(0.205 0 0);
    --popover-foreground: oklch(0.985 0 0);
    --primary: oklch(0.922 0 0);
    --primary-foreground: oklch(0.205 0 0);
    --secondary: oklch(0.269 0 0);
    --secondary-foreground: oklch(0.985 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.269 0 0);
    --accent-foreground: oklch(0.985 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --border: oklch(1 0 0 / 10%);
    --input: oklch(1 0 0 / 15%);
    --ring: oklch(0.556 0 0);
  }

  /* ── review chrome (sh-*): keep; extend product styles elsewhere ── */
  * { box-sizing: border-box }
  body {
    margin: 0; padding: 0 0 40px;
    background: var(--background, #f6f6f6); color: var(--foreground, #3a3a3a);
    font-family: var(--font, system-ui, sans-serif);
  }
  .sh-bar {
    position: sticky; top: 0; z-index: 999;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; background: #191a1c; color: #d7d7d7;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .sh-bar b, .sh-control-label { color: #8a8f98; font-weight: 500 }
  .sh-control { display: inline-flex; gap: 5px; align-items: center }
  .sh-bar button {
    border: 1px solid #3a3d42; background: none; color: inherit;
    font: inherit; padding: 2px 9px; border-radius: 99px; cursor: pointer;
  }
  .sh-bar select {
    width: 170px; border: 1px solid #3a3d42; background: #232428; color: inherit;
    font: inherit; padding: 3px 28px 3px 9px; border-radius: 7px; cursor: pointer;
    color-scheme: dark;
  }
  #sh-screen { width: 190px }
  .sh-bar button.on { background: #d7d7d7; color: #191a1c; border-color: #d7d7d7 }
  .sh-theme { display: inline-flex; border: 1px solid #3a3d42; border-radius: 99px; overflow: hidden }
  .sh-theme button { border: 0; border-radius: 0; padding: 2px 10px }
  .sh-spacer { flex: 1 }
  .sh-stage { max-width: 960px; margin: 0 auto; padding: 12px 16px 0 }
  [hidden] { display: none !important }

  /* viewport presets */
  .sh-vp-390 .sh-stage {
    max-width: 390px; background: var(--background, #f6f6f6);
    border: 10px solid #191a1c; border-radius: 28px;
    padding: 16px 12px; height: min(844px, calc(100dvh - 52px));
    overflow-y: auto; margin-top: 12px;
  }
  .sh-vp-768 .sh-stage {
    max-width: 768px; border: 1px solid #c4c4c4; border-radius: 12px;
    padding: 16px; margin-top: 12px;
  }

  /* placeholders */
  .wf-pic  { border-radius: 4px; background:
             repeating-linear-gradient(45deg, #e9e9e9, #e9e9e9 6px, #f2f2f2 6px, #f2f2f2 12px) }
  .sh-theme-dark .wf-pic { background: repeating-linear-gradient(45deg,
             color-mix(in srgb, var(--foreground) 16%, transparent) 0 6px,
             color-mix(in srgb, var(--foreground) 8%, transparent) 6px 12px) }

  /* ── product styles ── */
  .app { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; font-size: 14px; line-height: 1.5 }
  .app-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border) }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px }
  .brand-mark { width: 24px; height: 24px; border-radius: calc(var(--radius) * 0.6); background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; font: 600 13px var(--font-mono) }
  .hero h1 { margin: 0 0 4px; font-size: 22px; line-height: 1.3; letter-spacing: -0.01em }
  .hero p { margin: 0; color: var(--muted-foreground) }

  svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: calc(var(--radius) * 0.8); border: 1px solid transparent; font: 500 14px var(--font); cursor: pointer; white-space: nowrap; transition: background .15s, opacity .15s }
  .btn:focus-visible, .input:focus-visible, .chip:focus-visible { outline: 3px solid color-mix(in oklab, var(--ring) 50%, transparent); outline-offset: 1px }
  .btn-default { background: var(--primary); color: var(--primary-foreground) }
  .btn-default:hover:not(:disabled) { background: color-mix(in oklab, var(--primary) 85%, transparent) }
  .btn-outline { background: var(--background); color: var(--foreground); border-color: var(--border) }
  .btn-outline:hover:not(:disabled), .btn-ghost:hover:not(:disabled) { background: var(--accent); color: var(--accent-foreground) }
  .btn-ghost { background: transparent; color: var(--foreground) }
  .btn-icon { width: 36px; padding: 0 }
  .btn:disabled { opacity: .5; cursor: not-allowed }
  .spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite }
  @keyframes spin { to { transform: rotate(360deg) } }

  .field { display: flex; flex-direction: column; gap: 6px }
  .field-label { font-weight: 500 }
  .field-row { display: flex; gap: 8px }
  .input-wrap { position: relative; flex: 1; min-width: 0 }
  .input { width: 100%; height: 36px; padding: 0 36px 0 12px; border-radius: calc(var(--radius) * 0.8); border: 1px solid var(--input); background: transparent; color: var(--foreground); font: 14px var(--font) }
  .input.plain { padding-right: 12px }
  .input::placeholder { color: var(--muted-foreground) }
  .input[aria-invalid="true"] { border-color: var(--destructive) }
  .input-clear { position: absolute; right: 2px; top: 2px; width: 32px; height: 32px; border: 0; background: none; color: var(--muted-foreground); border-radius: calc(var(--radius) * 0.6); cursor: pointer; display: grid; place-items: center }
  .input-clear:hover { color: var(--foreground); background: var(--accent) }
  .field-error { color: var(--destructive); font-size: 13px; margin: 0 }

  .alert { display: grid; grid-template-columns: 16px 1fr; gap: 2px 10px; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card) }
  .alert svg { margin-top: 2px }
  .alert-title { font-weight: 500 }
  .alert-desc { grid-column: 2; color: var(--muted-foreground) }
  .alert-destructive { color: var(--destructive) }
  .alert-destructive .alert-desc { color: color-mix(in oklab, var(--destructive) 85%, var(--foreground)) }

  .section { display: flex; flex-direction: column; gap: 10px }
  .section-label { font-weight: 500; display: flex; align-items: baseline; gap: 6px }
  .section-label small { color: var(--muted-foreground); font-weight: 400; font-size: 13px }
  .chips { display: flex; flex-wrap: wrap; gap: 6px }
  .chip { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--background); color: var(--foreground); font: 13px var(--font); cursor: pointer }
  .chip:hover:not(:disabled) { background: var(--accent) }
  .chip[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary) }
  .chip:disabled { opacity: .5; cursor: not-allowed }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
  .actions .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px }

  .card { border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.4); background: var(--card); color: var(--card-foreground) }
  .card-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px }
  .card-title { margin: 0; font-size: 20px; line-height: 1.35; letter-spacing: -0.01em; overflow-wrap: anywhere }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted-foreground); font-size: 13px; align-items: center }
  .meta a { color: inherit; display: inline-flex; gap: 4px; align-items: center; text-decoration: underline; text-underline-offset: 3px }
  .meta a svg.i { width: 13px; height: 13px }
  .meta .dot::before { content: "·" }
  .card-body { padding: 20px 24px 24px }

  .empty { padding: 40px 24px; text-align: center; color: var(--muted-foreground); display: flex; flex-direction: column; align-items: center; gap: 8px }
  .empty .empty-icon { width: 40px; height: 40px; border-radius: var(--radius); background: var(--muted); display: grid; place-items: center; color: var(--foreground) }
  .empty strong { color: var(--foreground); font-weight: 500 }

  .skeleton { background: var(--muted); border-radius: calc(var(--radius) * 0.6); animation: pulse 1.5s ease-in-out infinite }
  @keyframes pulse { 50% { opacity: .5 } }

  .prose { font-size: 15px; line-height: 1.75; overflow-wrap: anywhere }
  .prose > :first-child { margin-top: 0 }
  .prose h2 { font-size: 18px; margin: 28px 0 8px; line-height: 1.4 }
  .prose h3 { font-size: 16px; margin: 22px 0 6px }
  .prose p { margin: 0 0 14px }
  .prose ul, .prose ol { margin: 0 0 14px; padding-left: 22px }
  .prose li { margin: 4px 0 }
  .prose a { color: var(--foreground); text-decoration: underline; text-underline-offset: 3px }
  .prose code { font: 13px var(--font-mono); background: var(--muted); padding: 1px 5px; border-radius: 4px }
  .prose pre { background: var(--muted); padding: 14px 16px; border-radius: var(--radius); overflow-x: auto; margin: 0 0 14px }
  .prose pre code { background: none; padding: 0; font-size: 13px; line-height: 1.6 }
  .prose blockquote { margin: 0 0 14px; padding-left: 14px; border-left: 3px solid var(--border); color: var(--muted-foreground) }
  .prose .table-wrap { overflow-x: auto; margin: 0 0 14px }
  .prose table { border-collapse: collapse; width: 100%; font-size: 14px }
  .prose th, .prose td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; white-space: nowrap }
  .prose th { background: var(--muted); font-weight: 500 }
  .prose figure { margin: 0 0 14px }
  .prose figure .wf-pic { aspect-ratio: 16 / 9 }
  .prose figcaption { font-size: 13px; color: var(--muted-foreground); margin-top: 6px }

  .toaster { position: sticky; bottom: 16px; display: flex; justify-content: center; pointer-events: none; height: 0; overflow: visible }
  .toast { transform: translateY(-100%); pointer-events: auto; display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-radius: var(--radius); background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); box-shadow: 0 6px 24px rgb(0 0 0 / 12%); font-size: 13px; max-width: calc(100% - 24px) }

  /* narrow */
  .sh-vp-390 .field-row { flex-direction: column }
  .sh-vp-390 .field-row .btn { width: 100% }
  .sh-vp-390 .actions .sep { display: none }
  .sh-vp-390 .actions .btn { flex: 1 1 calc(50% - 4px) }
  .sh-vp-390 .card-header, .sh-vp-390 .card-body { padding-left: 16px; padding-right: 16px }
  .sh-vp-390 .hero h1 { font-size: 20px }
  @media (max-width: 520px) {
    .field-row { flex-direction: column }
    .field-row .btn { width: 100% }
    .actions .sep { display: none }
    .actions .btn { flex: 1 1 calc(50% - 4px) }
    .card-header, .card-body { padding-left: 16px; padding-right: 16px }
  }
</style>

<header class="sh-bar">
  <b>proto</b>
  <label class="sh-control"><span class="sh-control-label">screen</span><select id="sh-screen"></select></label>
  <span class="sh-spacer"></span>
  <label class="sh-control"><span class="sh-control-label">state</span><select id="sh-state"></select></label>
  <button id="sh-vp">vp: full (m)</button>
  <div class="sh-theme" id="sh-theme" role="group" aria-label="theme (t)" hidden>
    <button data-theme="light">light</button><button data-theme="dark">dark</button>
  </div>
</header>

<main class="sh-stage">
  <section data-screen="converter" data-title="변환기" data-states="결과,긴 글,가져오기 실패,본문 없음">
    <div class="app">
      <header class="app-header" data-component="new:AppHeader">
        <div class="brand"><span class="brand-mark">M↓</span>feedme</div>
        <button class="btn btn-ghost btn-icon" id="theme-toggle" data-component="Button" aria-label="다크 모드로 전환">
          <svg class="i" id="icon-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg class="i" id="icon-sun" viewBox="0 0 24 24" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
      </header>

      <div class="hero">
        <h1>웹 페이지를 Markdown으로</h1>
        <p>URL을 붙여넣으면 본문만 뽑아 Markdown으로 바꿔 드려요. 복사하거나 ChatGPT·Claude로 바로 넘길 수 있어요.</p>
      </div>

      <form class="field" id="url-form" data-component="Field" novalidate>
        <label class="field-label" for="url">페이지 URL</label>
        <div class="field-row">
          <div class="input-wrap">
            <input class="input" id="url" data-component="Input" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://example.com/article">
            <button type="button" class="input-clear" id="clear" aria-label="지우기" hidden data-component="Button">
              <svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
          <button class="btn btn-default" id="convert" type="submit" data-component="Button">변환</button>
        </div>
        <p class="field-error" id="url-error" hidden></p>
      </form>

      <div class="alert alert-destructive" id="fetch-alert" role="alert" data-component="Alert" hidden>
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <div class="alert-title" id="fetch-alert-title"></div>
        <div class="alert-desc" id="fetch-alert-desc"></div>
      </div>

      <div class="section" data-component="ToggleGroup">
        <div class="section-label">프롬프트 <small>선택하면 본문 앞에 붙어요</small></div>
        <div class="chips" id="chips">
          <button class="chip" data-prompt="요약해줘" aria-pressed="false">요약해줘</button>
          <button class="chip" data-prompt="한국어로 번역해줘" aria-pressed="false">한국어로 번역해줘</button>
          <button class="chip" data-prompt="쉽게 설명해줘" aria-pressed="false">쉽게 설명해줘</button>
          <button class="chip" data-prompt="custom" aria-pressed="false">직접 입력</button>
        </div>
        <input class="input plain" id="custom-prompt" data-component="Input" placeholder="예: 핵심 주장 3개와 반론을 정리해줘" hidden>
      </div>

      <div class="section">
        <div class="actions" id="actions">
          <button class="btn btn-outline" id="copy" data-component="Button">
            <svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>복사하기</button>
          <button class="btn btn-outline" id="download" data-component="Button">
            <svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>.md 다운로드</button>
          <span class="sep"></span>
          <button class="btn btn-outline" id="open-chatgpt" data-component="Button">
            <svg class="i" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>ChatGPT로 열기</button>
          <button class="btn btn-outline" id="open-claude" data-component="Button">
            <svg class="i" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>Claude로 열기</button>
        </div>
        <div class="alert" id="trunc-alert" role="status" data-component="Alert" hidden>
          <svg class="i" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/></svg>
          <div class="alert-title">본문이 길어 일부만 전달됐어요</div>
          <div class="alert-desc" id="trunc-desc"></div>
        </div>
      </div>

      <article class="card" id="result" data-component="Card">
        <div id="result-empty" class="empty" data-component="Empty">
          <div class="empty-icon"><svg class="i" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg></div>
          <strong>아직 변환한 페이지가 없어요</strong>
          <span>위에 URL을 붙여넣고 변환을 누르세요.</span>
        </div>
        <div id="result-loading" hidden data-component="Skeleton">
          <div class="card-header">
            <div class="skeleton" style="height:24px;width:70%"></div>
            <div class="skeleton" style="height:14px;width:40%"></div>
          </div>
          <div class="card-body" style="display:flex;flex-direction:column;gap:10px">
            <div class="skeleton" style="height:14px;width:100%"></div>
            <div class="skeleton" style="height:14px;width:94%"></div>
            <div class="skeleton" style="height:14px;width:88%"></div>
            <div class="skeleton" style="height:14px;width:60%"></div>
          </div>
        </div>
        <div id="result-content" hidden>
          <div class="card-header">
            <h2 class="card-title" id="r-title"></h2>
            <div class="meta" id="r-meta"></div>
          </div>
          <div class="card-body prose" id="r-body"></div>

<script>
  const stage = document.querySelector('.sh-stage');
  const screens = [...stage.querySelectorAll('[data-screen]')];
  const screenSelect = document.getElementById('sh-screen');
  const stateSelect = document.getElementById('sh-state');
  const vpBtn = document.getElementById('sh-vp');
  const themeCtl = document.getElementById('sh-theme');
  const themeBtns = [...themeCtl.querySelectorAll('button')];
  let current = null;
  let currentStates = [];

  screens.forEach(s => {
    const option = document.createElement('option');
    option.textContent = s.dataset.title || s.dataset.screen;
    option.value = s.dataset.screen;
    screenSelect.append(option);
  });
  screenSelect.onchange = () => show(screenSelect.value);

  function show(slug) {
    current = screens.find(s => s.dataset.screen === slug) || screens[0];
    screens.forEach(s => s.hidden = s !== current);
    screenSelect.value = current.dataset.screen;
    history.replaceState(null, '', '#' + current.dataset.screen);
    buildStates();
  }

  function buildStates() {
    const declared = (current.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
    currentStates = ['Default', ...declared.filter(name => name !== 'Default')];
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    current.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
  }
  stateSelect.onchange = () => applyState(stateSelect.value);

  window.prototypeShell = {
    showScreen: show,
    setState: applyState,
    getScreen: () => current?.dataset.screen,
    getState: () => stateSelect.value
  };

  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  const hasDark = [...document.styleSheets].some(sheet => {
    try {
      return [...sheet.cssRules].some(rule => (rule.selectorText || '')
        .split(',').some(part => /\.sh-theme-dark$/.test(part.trim())));
    } catch { return false }
  });
  let dark = false;
  function applyTheme() {
    document.documentElement.classList.toggle('sh-theme-dark', dark);
    document.body.classList.toggle('sh-theme-dark', dark);
    themeBtns.forEach(b => b.classList.toggle('on', (b.dataset.theme === 'dark') === dark));
  }
  themeCtl.hidden = !hasDark;
  themeBtns.forEach(b => b.onclick = () => { dark = b.dataset.theme === 'dark'; applyTheme(); });
  applyTheme();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const i = screens.indexOf(current);
    if (e.key === 'ArrowRight') show(screens[(i + 1) % screens.length].dataset.screen);
    if (e.key === 'ArrowLeft') show(screens[(i - 1 + screens.length) % screens.length].dataset.screen);
    if (e.key === 'm') vpBtn.click();
    if (e.key === 't' && !themeCtl.hidden) { dark = !dark; applyTheme(); }
  });

  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>

<script>

  const LONG_ARTICLE = (() => {
    const sections = [
      ['1장. 분산 시스템에서 시간은 왜 어려운가', '네트워크로 연결된 두 대의 서버는 같은 순간을 공유하지 않습니다. NTP로 동기화해도 수 밀리초의 오차가 남고, 가상 머신이 일시 정지되면 그 오차는 몇 초로 늘어납니다. 이 장에서는 물리 시계를 믿을 수 없는 이유와, 그 대신 무엇을 기준으로 순서를 정해야 하는지 살펴봅니다.'],
      ['2장. 램포트 시계와 인과 관계', '램포트는 1978년 논문에서 "먼저 일어났다"는 관계를 시계 없이 정의했습니다. 각 노드는 이벤트마다 카운터를 하나씩 올리고, 메시지를 받을 때는 상대의 카운터와 자신의 카운터 중 큰 값에 1을 더합니다. 이 단순한 규칙만으로 인과적으로 연결된 이벤트의 순서를 보장할 수 있습니다.'],
      ['3장. 벡터 시계로 동시성 구분하기', '램포트 시계는 순서를 알려 주지만, 두 이벤트가 동시에 일어났는지는 알려 주지 못합니다. 벡터 시계는 노드마다 하나씩 카운터를 두어 이 문제를 풉니다. 다만 노드 수가 늘어나면 메시지마다 붙는 벡터도 함께 커진다는 비용이 있습니다.'],
      ['4장. 하이브리드 논리 시계', 'HLC는 물리 시각과 논리 카운터를 함께 들고 다닙니다. 사람이 읽을 수 있는 타임스탬프를 유지하면서도 인과 순서를 보장하므로, CockroachDB와 YugabyteDB 같은 분산 데이터베이스가 이 방식을 씁니다.'],
      ['5장. TrueTime과 커밋 대기', '구글 Spanner는 GPS와 원자시계로 시각의 불확실성 구간을 7ms 이내로 줄이고, 트랜잭션을 커밋하기 전에 그 구간만큼 기다립니다. 하드웨어로 문제를 푼 드문 사례지만, 같은 아이디어를 소프트웨어로 흉내 내려는 시도도 이어지고 있습니다.'],
      ['6장. 실무에서 마주치는 함정', '로그의 타임스탬프로 장애 순서를 재구성하다가 원인과 결과를 뒤바꿔 읽는 일이 흔합니다. 서로 다른 서버의 로그를 합칠 때는 요청 ID와 같은 인과 정보를 함께 남겨야 합니다.']
    ];
    const parts = ['이 글은 사내 스터디에서 6주 동안 다룬 내용을 정리한 것입니다. 각 장은 독립적으로 읽을 수 있지만, 순서대로 읽으면 개념이 쌓이도록 구성했습니다.'];
    sections.forEach(([h, p], i) => {
      parts.push('## ' + h, p,
        '- 핵심: ' + h.split('. ')[1] + '\n- 참고 문헌 ' + (i + 3) + '편\n- 실습 시간 약 ' + (40 + i * 15) + '분');
      ['첫째 주 발표', '둘째 주 실습', '셋째 주 토론'].forEach((w, k) => parts.push(
        '### ' + w,
        w + '에서는 ' + h.split('. ')[1] + '을(를) 주제로 ' + (k + 2) + '명이 발표했습니다. ' + p,
        '발표 뒤 질의응답에서는 "이 방식이 네트워크 분할 상황에서도 안전한가", "노드가 재시작되면 카운터를 어디서부터 이어 가야 하는가" 같은 질문이 나왔습니다. 결론을 바로 내리지 못한 질문은 다음 주 과제로 넘겼고, 과제 결과는 팀 위키의 ' + (i + 1) + '-' + (k + 1) + ' 문서에 정리했습니다.'));
      parts.push(p + ' 스터디에서는 이 부분을 직접 구현해 보며 ' + (i + 2) + '가지 반례를 찾았습니다.');
    });
    parts.push('## 마치며', '시간을 다루는 문제는 결국 "무엇을 믿을 것인가"의 문제입니다. 물리 시계, 논리 시계, 하드웨어 보증 중 무엇을 고르든 그 선택의 비용을 알고 쓰는 것이 중요합니다.');
    return {
      url: 'https://engineering.example.org/2026/distributed-clocks-study-notes',
      title: '분산 시스템의 시간: 램포트 시계부터 TrueTime까지 6주 스터디 정리',
      author: '',
      domain: 'engineering.example.org',
      markdown: parts.join('\n\n')
    };
  })();

  const app = { status: 'idle', article: null, prompt: null, truncated: false };

  /* tiny markdown renderer for the dummy content */
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" onclick="return false">$1</a>');
  function renderMd(md) {
    return md.split('\n\n').map(b => {
      if (b.startsWith('```')) return '<pre><code>' + esc(b.replace(/^```\w*\n|\n```$/g, '')) + '</code></pre>';
      if (b.startsWith('### ')) return '<h3>' + inline(b.slice(4)) + '</h3>';
      if (b.startsWith('## ')) return '<h2>' + inline(b.slice(3)) + '</h2>';
      if (b.startsWith('> ')) return '<blockquote><p>' + inline(b.slice(2)) + '</p></blockquote>';
      if (b.startsWith('![')) { const alt = b.match(/!\[([^\]]*)\]/)[1]; return '<figure><div class="wf-pic" role="img" aria-label="' + esc(alt) + '"></div><figcaption>' + esc(alt) + '</figcaption></figure>'; }
      if (b.startsWith('- ')) return '<ul>' + b.split('\n').map(l => '<li>' + inline(l.slice(2)) + '</li>').join('') + '</ul>';
      if (b.startsWith('|')) {
        const rows = b.split('\n').filter((_, i) => i !== 1).map(r => r.split('|').slice(1, -1).map(c => c.trim()));
        return '<div class="table-wrap"><table><thead><tr>' + rows[0].map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' +
          rows.slice(1).map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
      }
      return '<p>' + inline(b) + '</p>';
    }).join('');
  }

  function currentPrompt() {
    if (app.prompt === 'custom') return $('custom-prompt').value.trim();
    return app.prompt || '';
  }
  function fullMarkdown(a) {
    return '# ' + a.title + '\n\n' + (a.author ? '저자: ' + a.author + '  \n' : '') + '원문: ' + a.url + '\n\n' + a.markdown;
  }
  function payload() {
    const p = currentPrompt();
    return (p ? p + '\n\n' : '') + fullMarkdown(app.article);
  }

  function render() {
    const a = app.article, has = app.status === 'result';
    $('clear').hidden = !$('url').value;
    $('convert').disabled = app.status === 'loading';
    $('convert').innerHTML = app.status === 'loading' ? '<span class="spinner"></span>변환 중' : '변환';
    $('result').hidden = app.status === 'error';
    $('result-empty').hidden = app.status !== 'idle';
    $('result-loading').hidden = app.status !== 'loading';
    $('result-content').hidden = !has;
    ['copy', 'download', 'open-chatgpt', 'open-claude'].forEach(id => $(id).disabled = !has);
    $('chips').querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.prompt === app.prompt)));
    $('custom-prompt').hidden = app.prompt !== 'custom';
    $('trunc-alert').hidden = !(has && app.truncated);
    if (has) {
      $('r-title').textContent = a.title;
      $('r-meta').innerHTML = (a.author ? '<span>' + esc(a.author) + '</span><span class="dot"></span>' : '') +
        '<a href="' + a.url + '" onclick="return false">' + esc(a.domain) +
        '<svg class="i" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></a>';
      $('r-body').innerHTML = renderMd(a.markdown);
    }
  }

  function setUrlError(msg) {
    $('url-error').hidden = !msg; $('url-error').textContent = msg || '';
    $('url').setAttribute('aria-invalid', msg ? 'true' : 'false');
  }
  const FETCH_ERRORS = {
    fetch: ['페이지를 가져오지 못했어요', '주소가 맞는지 확인해 주세요. 사이트가 응답하지 않거나(404·500) HTML 페이지가 아닐 수 있어요.'],
    blocked: ['이 주소는 가져올 수 없어요', '내부망이나 로컬 주소(localhost, 192.168.x.x 등)는 변환할 수 없어요.'],
    empty: ['본문을 찾지 못했어요', '페이지는 열렸지만 읽을 만한 본문이 없어요. 스크립트로 내용을 그리는 페이지이거나 로그인이 필요한 페이지일 수 있어요.']
  };
  function setFetchError(kind) {
    $('fetch-alert').hidden = !kind;
    if (kind) { $('fetch-alert-title').textContent = FETCH_ERRORS[kind][0]; $('fetch-alert-desc').textContent = FETCH_ERRORS[kind][1]; }
  }

  function syncPreset() {
    const map = { result: app.article === LONG_ARTICLE ? '긴 글' : '결과' };
    let name = 'Default';
    if (app.status === 'result') name = map.result;
    if (app.status === 'error') name = app.errorKind === 'empty' ? '본문 없음' : app.errorKind === 'fetch' ? '가져오기 실패' : 'Default';
    prototypeShell.setState(name);
  }

  function outcomeFor(url) {
    let u; try { u = new URL(url); } catch { return 'invalid'; }
    if (!/^https?:$/.test(u.protocol)) return 'invalid';
    if (/^(localhost|127\.|10\.|192\.168\.|169\.254\.|0\.0\.0\.0)/.test(u.hostname)) return 'blocked';
    if (/404|nope|\.png$|\.jpg$/.test(url)) return 'fetch';
    if (/spa|app\./.test(url)) return 'empty';
    if (/long|engineering/.test(url)) return 'long';
    return 'ok';
  }

  let timer;
  function convert(url, immediate) {
    clearTimeout(timer);
    setUrlError(''); setFetchError(null);
    const o = outcomeFor(url);
    if (!url) { setUrlError('URL을 입력해 주세요.'); app.status = 'idle'; app.article = null; render(); syncPreset(); return; }
    if (o === 'invalid') { setUrlError('http:// 또는 https://로 시작하는 주소를 입력해 주세요.'); app.status = 'idle'; app.article = null; render(); syncPreset(); return; }
    app.status = 'loading'; app.truncated = false; render();
    const finish = () => {
      if (o === 'ok' || o === 'long') { app.status = 'result'; app.article = o === 'long' ? LONG_ARTICLE : ARTICLE; }
      else { app.status = 'error'; app.errorKind = o; app.article = null; setFetchError(o); }
      render(); syncPreset();
    };
    immediate ? finish() : (timer = setTimeout(finish, 1100));
  }

  $('url-form').onsubmit = e => { e.preventDefault(); convert($('url').value.trim()); };
  $('url').oninput = () => { $('clear').hidden = !$('url').value; if ($('url-error').textContent) setUrlError(''); };
  function resetAll() {
    clearTimeout(timer);
    $('url').value = ''; $('custom-prompt').value = '';
    app.status = 'idle'; app.article = null; app.prompt = null; app.truncated = false;
    setUrlError(''); setFetchError(null); render(); syncPreset(); $('url').focus();
  }
  $('clear').onclick = resetAll;

  $('chips').onclick = e => {
    const c = e.target.closest('.chip'); if (!c) return;
    app.prompt = app.prompt === c.dataset.prompt ? null : c.dataset.prompt;
    app.truncated = false; render();
    if (app.prompt === 'custom') $('custom-prompt').focus();
  };
  $('custom-prompt').oninput = () => { if (app.truncated) { app.truncated = false; render(); } };

  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.innerHTML = '<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>' + esc(msg); t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600);
  }

  $('copy').onclick = () => {
    const text = payload();
    (navigator.clipboard?.writeText(text) || Promise.reject()).catch(() => {});
    toast(currentPrompt() ? '프롬프트와 함께 복사했어요' : '복사했어요');
  };
  $('download').onclick = () => {
    const a = app.article;
    const name = (a.title || a.domain).replace(/[\\/:*?"<>|]/g, '').trim().slice(0, 80) + '.md';
    const link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([fullMarkdown(a)], { type: 'text/markdown' }));
    link.download = name; link.click(); URL.revokeObjectURL(link.href);
    toast(name + ' 파일을 받았어요');
  };
  function openLLM(service) {
    const text = payload();
    app.truncated = text.length > URL_LIMIT;
    if (app.truncated) {
      $('trunc-desc').textContent = '전체 ' + text.length.toLocaleString() + '자 중 앞부분 약 ' + URL_LIMIT.toLocaleString() +
        '자만 ' + service + '에 넘겼어요. 전체가 필요하면 복사하기로 붙여넣으세요.';
    }
    render();
    toast(service + ' 새 대화를 새 탭에서 열었어요');
  }
  $('open-chatgpt').onclick = () => openLLM('ChatGPT');
  $('open-claude').onclick = () => openLLM('Claude');

  function syncThemeIcon() {
    const d = document.body.classList.contains('sh-theme-dark');
    $('icon-moon').hidden = d; $('icon-sun').hidden = !d;
    $('theme-toggle').setAttribute('aria-label', d ? '라이트 모드로 전환' : '다크 모드로 전환');
  }
  $('theme-toggle').onclick = () => {
    const d = document.body.classList.contains('sh-theme-dark');
    document.querySelector('#sh-theme button[data-theme="' + (d ? 'light' : 'dark') + '"]').click();
    syncThemeIcon();
  };
  new MutationObserver(syncThemeIcon).observe(document.body, { attributes: true, attributeFilter: ['class'] });

  /* review presets */
  stateSelect.addEventListener('change', () => {
    const s = stateSelect.value;
    app.prompt = null; $('custom-prompt').value = '';
    if (s === 'Default') { resetAll(); prototypeShell.setState('Default'); return; }
    const url = { '결과': ARTICLE.url, '긴 글': LONG_ARTICLE.url, '가져오기 실패': 'https://shop.example.kr/products/404', '본문 없음': 'https://app.example.io/dashboard' }[s];
    $('url').value = url; convert(url, true);
  });

  render();
</script>
